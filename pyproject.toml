[project]
name = "whats-the-weather"
version = "0.1.0"
description = ""
authors = [
    {name = "Alex Wu",email = "itsalexwu@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "google-genai (>=2.16.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "whats_the_weather", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
]